<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Desk</title>
<link href="styles.css" rel="stylesheet"/>
</head>
<body>
<main class="stage">
<header class="header">
<h1>My Desk</h1>
<p class="intro">Explore my desk and guess their value.</p>
</header>
<section class="gallery">
<button class="thumb" data-alt="Desk photo 1" data-full="images/desk1.jpg" type="button">
<img alt="Desk photo 1" src="images/desk1.jpg"/>
</button>
<button class="thumb" data-alt="Desk photo 2" data-full="images/desk2.jpg" type="button">
<img alt="Desk photo 2" src="images/desk2.jpg"/>
</button>
<button class="thumb" data-alt="Desk photo 3" data-full="images/desk3.jpg" type="button">
<img alt="Desk photo 3" src="images/desk3.jpg"/>
</button>
<button class="thumb" data-alt="Desk photo 4" data-full="images/desk4.jpg" type="button">
<img alt="Desk photo 4" src="images/desk4.jpg"/>
</button>
<button class="thumb" data-alt="Desk photo 5" data-full="images/desk5.jpg" type="button">
<img alt="Desk photo 5" src="images/desk5.jpg"/>
</button>
</section>
<footer class="footer">
<p>Click any image to open it.</p>
</footer>
</main>
<div class="overlay hidden">
<div class="overlay-panel">
<button class="close" type="button">Close</button>
<figure class="overlay-figure">
<img alt="" class="overlay-img" src=""/>
<figcaption class="caption">
<p>This desk is more than gear. The budget spent on this setup returns in greater value through time saving, lower stress, stronger focus, and everyday comfort. Look closely and guess which details matter most.</p>
</figcaption>
</figure>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
